<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSPod - TRI POD Archive Editor</title>
  <meta name="description" content="JSPod is a browser-based POD archive editor for Terminal Reality games. Create, edit, validate and save POD1 and POD2 archives, open EPD, and preview RAW, BIN, SMF, text, audio and more.">
  <meta name="keywords" content="POD editor, POD viewer, Terminal Reality, MTM2, Monster Truck Madness, 4x4 Evolution, Hellbender, Terminal Velocity, Fury3, Nocturne, BIN viewer, RAW image">
  <meta name="author" content="Juan Pablo Utreras">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app-shell">

    <header class="topbar">
      <div class="brand">
        <h1><a href="https://github.com/juanputrerasm/JSPod">JSPod <span class="app-version">v2.1.1</span></a></h1>
        <p>TRI POD Archive Editor</p>
      </div>
      <nav id="menubar" aria-label="Main menu"></nav>
      <div class="status-strip"><span id="status-bar">Ready.</span></div>
    </header>

    <div id="toolbar" class="toolbar-wrap">
      <div class="toolbar" role="toolbar" aria-label="Archive">
        <button type="button" data-action="new" title="New archive">＋ New</button>
        <button type="button" data-action="open" title="Open a POD, EPD or ZIP">📂 Open</button>
        <button type="button" data-action="save" title="Save">💾 Save</button>
        <span class="toolbar-sep"></span>
        <button type="button" data-action="undo" title="Undo">↶ Undo</button>
        <button type="button" data-action="redo" title="Redo">↷ Redo</button>
        <span class="toolbar-sep"></span>
        <button type="button" data-action="add" title="Add files">Add Files</button>
        <button type="button" data-action="addFolder" title="Add a folder and everything in it">Add Folder</button>
        <button type="button" data-action="newFolder" title="Create an empty folder">New Folder</button>
        <button type="button" data-action="remove" title="Remove the selection (Delete)">Remove</button>
        <span class="toolbar-sep"></span>
        <button type="button" data-action="extract" title="Extract the selection">⬇ Extract</button>
        <button type="button" data-action="find" title="Find (Ctrl+F)">🔍 Find</button>
      </div>
      <div class="archive-bar" id="archive-info">
        <span id="archive-name" class="archive-name">No archive open</span>
        <span id="archive-format" class="badge" hidden></span>
        <label class="archive-field comment-field">Comment
          <input id="comment-input" type="text" spellcheck="false" disabled>
          <span id="comment-count" class="comment-count"></span>
        </label>
        <label class="archive-field">Save as
          <select id="output-format" disabled>
            <option value="pod1">POD1</option>
            <option value="pod2">POD2</option>
          </select>
        </label>
      </div>
      <div class="filter-bar">
        <span class="search-icon">🔍</span>
        <input id="search-input" type="search" placeholder="Filter by path..." spellcheck="false">
        <button type="button" data-action="expand" class="quiet">Expand all</button>
        <button type="button" data-action="collapse" class="quiet">Collapse all</button>
      </div>
    </div>

    <main class="main-layout" id="main-layout">
      <section class="list-panel">
        <div id="entry-list"></div>
      </section>
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
      <section class="preview-panel">
        <div id="preview-meta" class="preview-meta"></div>
        <div id="preview-content" class="preview-content"></div>
      </section>
    </main>

    <footer class="footer"><span id="footer-status"></span></footer>

    <div id="loading-overlay" class="loading-overlay" hidden>
      <div class="spinner"></div>
      <span id="loading-msg">Loading...</span>
    </div>

    <dialog id="main-dialog" class="main-dialog"></dialog>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
